[project]
name = "quiltz"
version = "0.1.0"
description = "Infrastructure code tested against an emulator, with the emulator's boundary stated first."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quelin Zammit" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Empty, and that is the argument rather than an omission. The subject of this repository is
# HCL, a linter and two binaries that are not Python packages at all. The Python here exists to
# drive them and to hold the boundary as data, and it needs nothing at runtime to do that.
dependencies = []

[project.urls]
Homepage = "https://github.com/PNX89/QUILTZ"
Source = "https://github.com/PNX89/QUILTZ"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # parliament 1.6.4 still imports pkg_resources, which setuptools removed in 81. Without
    # this pin it does not import at all on this machine's Python 3.14. Found by the pre-flight
    # rather than on build day, which is the only reason it costs a line here instead of an hour.
    "setuptools<81",
    "parliament>=1.6.4",
    "moto[server]>=5.2.3",
    "boto3>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quiltz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two markers, and both are DESELECTED by default rather than skipped, because a skipped test
# reports as a pass and nobody reads it.
#   emulator: needs moto_server listening
#   container: needs a Docker runtime, which is only the Lambda execution leg
addopts = "-q -m 'not emulator and not container'"
markers = [
    "emulator: needs moto_server. Run with -m emulator.",
    "container: needs a Docker runtime, because moto runs Lambda handlers in one. Run with -m container.",
]
filterwarnings = [
    "error",
    # parliament 1.6.4 imports pkg_resources and carries several invalid escape sequences in
    # its own source. Both are its problem and neither is reachable from this repository's
    # code, so they are silenced NARROWLY, by module, rather than by relaxing the error rule
    # for everything. The setuptools pin in the dev group is the other half of the same issue.
    "ignore:pkg_resources is deprecated:UserWarning:parliament",
    "ignore::SyntaxWarning:parliament",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true

# parliament ships no type information. The override is scoped to that one module rather than
# relaxing anything globally, so everything this repository writes is still checked strictly and
# only the untyped third party is exempt.
[[tool.mypy.overrides]]
module = ["parliament", "parliament.*"]
ignore_missing_imports = true
