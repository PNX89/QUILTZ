apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-evidence-collector
  labels:
    app.kubernetes.io/name: evidence-collector
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # The ServiceAccount this chart creates, actually used. It was created and never
          # referenced until 28-8-2026, so every pod ran under the namespace `default` while
          # the chart shipped an identity implying otherwise. A ServiceAccount nothing
          # references is worse than none: it reads as scoped access that was never granted.
          serviceAccountName: {{ .Release.Name }}-evidence-collector
          automountServiceAccountToken: false
          containers:
            - name: collector
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: QUILTZ_BUCKET
                  value: {{ .Values.bucket | quote }}
                - name: AWS_REGION
                  value: {{ .Values.region | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
