name: CI

# Nothing here reaches a cloud account and nothing here needs a credential. Every module is
# applied to an emulator, and the two binaries under test are single static files fetched from
# their publishers at pinned versions.
#
# FIVE JOBS, AND THE SPLIT IS THE POINT. This repository's first sentence is that an emulator
# result is worth something only when its boundary is stated, so the boundary of its own test
# rig is drawn here rather than blurred:
#
#   checks      lint, types and the offline suite. No emulator, no container, no binaries.
#   chart       helm lint and a golden-file render, with KUBECONFIG pointed at nothing.
#   emulator    the modules applied to moto_server, under BOTH Terraform and OpenTofu.
#   statelock   the pg backend against a real PostgreSQL, which is the one claim here that no
#               emulator is involved in at all.
#   container   the one leg that needs a Docker runtime, because moto executes Lambda handlers
#               inside a container. Five of this repository's six legs are container-free and
#               this one is not, and saying "container-free" without that qualifier would be
#               exactly the over-reading the repository exists to refuse.
#
# The shared legs live in PNX89/.github and are pinned to a tag rather than a branch, so a
# commit in that repository cannot turn this badge red.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # helm is a single static binary and no cluster is involved, so this could have lived in the
  # offline job. It does not, because the offline job must run on a machine with nothing
  # installed: that is what makes "it renders correctly without a cluster" checkable by a
  # stranger who clones this and runs pytest.
  chart:
    name: the chart, with no cluster anywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - run: uv sync --dev
      - name: lint and render with KUBECONFIG pointed at nothing
        env:
          KUBECONFIG: /nonexistent
        run: uv run pytest -m helm

  # The modules applied to moto_server under BOTH binaries, and the committed plans regenerated
  # and compared against what is in the tree. A plan file that nothing regenerates is a claim
  # about the past that quietly stops being true, so this job is what makes docs/evidence/plans
  # evidence rather than decoration.
  emulator:
    name: both binaries against the emulator, and the committed plans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          # The wrapper reformats stdout, and this job reads `terraform show -json`.
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - run: uv sync --dev
      - name: fetch the collection, which is GPL and therefore never vendored
        run: uv run scripts/fetch_tools.sh
      - name: start the emulator
        run: |
          uv run python -m moto.server -p 5599 --host 0.0.0.0 &
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:5599 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the emulator never came up" >&2
          exit 1
      - name: provision the bucket, because the playbook only configures one
        working-directory: modules/storage
        run: |
          terraform init -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var endpoint=http://127.0.0.1:5599 -var bucket_name=quiltz-evidence
      - name: regenerate every committed plan
        run: scripts/regenerate_plans.sh http://127.0.0.1:5599
      - name: fail if a committed plan no longer matches the configuration
        run: python3 scripts/check_plan_drift.py
      - name: re-derive the boundary transcript
        run: uv run scripts/measure_boundary.py
      - name: fail if the committed transcript no longer matches what was measured
        run: git diff --exit-code -- docs/evidence/iam
      - name: apply twice under each binary and require the second to do nothing
        run: |
          scripts/prove_convergence.sh terraform http://127.0.0.1:5599 quiltz-converge-terraform
          scripts/prove_convergence.sh tofu http://127.0.0.1:5599 quiltz-converge-tofu
      - name: fail if either convergence transcript has changed
        run: git diff --exit-code -- docs/evidence/convergence
      - name: the emulator suite
        run: uv run pytest -m emulator

  # The ONE leg that needs a Docker runtime. moto executes Lambda handlers in a container, so
  # the end-to-end queue-to-topic path cannot be container-free and this repository says so
  # rather than rounding it off. Five of six legs need no runtime; this one does.
  container:
    name: the queue-to-topic path, which does need a runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: uv sync --dev
      - name: start the emulator on every interface
        run: |
          uv run python -m moto.server -p 5599 --host 0.0.0.0 &
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:5599 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the emulator never came up" >&2
          exit 1
      - name: apply the module with the two addresses the emulator answers on
        working-directory: modules/events
        run: |
          # The handler reaches the emulator by a DIFFERENT string from the one Terraform uses,
          # because it runs inside a container where 127.0.0.1 is the container itself. On
          # Docker Desktop that is host.docker.internal; on a Linux runner it is the bridge
          # gateway, which is read here rather than hardcoded as 172.17.0.1.
          GATEWAY=$(docker network inspect bridge --format '{{ (index .IPAM.Config 0).Gateway }}')
          echo "the bridge gateway is $GATEWAY"
          terraform init -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var endpoint=http://127.0.0.1:5599 \
            -var "endpoint_from_lambda=http://$GATEWAY:5599"
      - name: the container suite
        run: uv run pytest -m container

  # The state lock is the only claim in this repository that involves no emulator. It needs a
  # real PostgreSQL, so it gets a real one rather than a stand-in.
  #
  # The transcripts are regenerated here but NOT byte-compared: they carry lock ids, resource
  # ids, pids and timestamps that differ every run. summary.json carries only the outcomes, and
  # that is diffed. Without this job the five facts would be exactly what they were until
  # 28-8-2026, hand-produced numbers nobody could reproduce, three of which turned out to have
  # evidence that did not support them.
  statelock:
    name: the state lock, against a real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiltz
          POSTGRES_PASSWORD: quiltz
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: re-derive every state lock fact
        run: |
          scripts/measure_statelock.sh \
            "postgres://quiltz:quiltz@127.0.0.1:5432/quiltz_statelock?sslmode=disable"
      - name: fail if the outcomes have changed
        run: git diff --exit-code -- docs/evidence/statelock/summary.json
